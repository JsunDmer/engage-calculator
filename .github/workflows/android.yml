name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dfile.encoding=UTF-8"

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: engage-calculator-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Build & publish release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # tag 形如 v1.2.3：去掉前缀作为 versionName，tag 序号作为 versionCode。
      - name: Derive version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG#v}"
          CODE=$(echo "$NAME" | awk -F. '{printf "%d", $1*10000 + $2*100 + $3}')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${CODE:-1}" >> "$GITHUB_OUTPUT"

      # 有 Secrets 用官方 keystore；没有则在 CI 内临时生成一个，保证 release APK 可直接安装。
      # secrets 不能在 if 中引用，故在 shell 里判空。
      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          STORE="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$STORE"
            {
              echo "KEYSTORE_PASSWORD=$SECRET_STORE_PASSWORD"
              echo "KEY_ALIAS=$SECRET_KEY_ALIAS"
              echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 未配置，使用 CI 临时生成的签名密钥"
            keytool -genkeypair -v \
              -keystore "$STORE" \
              -alias engage-ci -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass engage-ci-pass -keypass engage-ci-pass \
              -dname "CN=Engage Calculator CI, O=Engage, C=CN"
            {
              echo "KEYSTORE_PASSWORD=engage-ci-pass"
              echo "KEY_ALIAS=engage-ci"
              echo "KEY_PASSWORD=engage-ci-pass"
            } >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$STORE" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ steps.version.outputs.code }}"

      - name: Rename APK
        run: |
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "dist/engage-calculator-${{ steps.version.outputs.name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.apk